# Weekly encrypted backup of the app's data (the `public` schema).
#
# This repository is public, and workflow artifacts on public repos can be downloaded by
# any signed-in GitHub user — so the dump is encrypted (AES-256) before upload.
# Restore steps are in README.md → "Backups".
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  Supabase *session pooler* URL (port 5432, user postgres.<project-ref>).
#                        Not the direct db.<ref>.supabase.co host: that is IPv6-only and
#                        GitHub's runners can't reach it.
#   BACKUP_PASSPHRASE    A long random passphrase. Keep a copy in your password manager —
#                        without it the backups can't be decrypted.
#
# The weekly query also keeps the free Supabase project from pausing after 7 idle days.

name: Weekly database backup

on:
  schedule:
    - cron: "30 20 * * 6" # Sundays 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump, compress and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ] || [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "::error::Set the BACKUP_DATABASE_URL and BACKUP_PASSPHRASE repository secrets."
            exit 1
          fi
          stamp="$(date -u +%Y-%m-%d)"
          # pg_dump must match the server's major version (Supabase runs Postgres 17).
          docker run --rm -e DATABASE_URL postgres:17-alpine \
            sh -c 'pg_dump "$DATABASE_URL" --schema=public --no-owner --no-privileges --format=custom' \
            > backup.dump
          test -s backup.dump
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in backup.dump -out "expense-tracker-${stamp}.dump.enc" -pass env:BACKUP_PASSPHRASE
          rm -f backup.dump
          ls -lh ./*.dump.enc

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: "*.dump.enc"
          retention-days: 90
          if-no-files-found: error
